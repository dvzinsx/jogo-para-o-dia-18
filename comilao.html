<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comilão — jogo de labirinto em 3 fases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
<aside class="rank" aria-labelledby="rankTitle">
  <h2 id="rankTitle">RANK</h2>
  <p class="sub">Top 10 deste navegador</p>
  <ol id="rankList"></ol>
  <button class="reset" id="rankReset" type="button">Apagar rank e recorde</button>
</aside>
<main class="app">
  <h1>COMILÃO</h1>
  <div class="stats">
    <div class="stat"><span>Pontos</span><b id="score">0</b></div>
    <div class="stat"><span>Recorde</span><b id="hi">0</b></div>
    <div class="stat"><span>Fase</span><b id="lvl">1/3</b></div>
    <div class="stat"><span>Vidas</span><b id="lives">❤❤❤</b></div>
  </div>
  <div class="fx" id="fx"></div>
  <div class="stage">
    <canvas id="game" aria-label="Área do jogo"></canvas>
    <div class="overlay show" id="overlay">
      <div class="card">
        <h2 id="ovTitle"></h2>
        <p id="ovText"></p>
        <form class="nick" id="nickForm" hidden autocomplete="off">
          <label for="nick">Digite seu nickname para entrar no rank</label>
          <input id="nick" name="nick" maxlength="12" required spellcheck="false" placeholder="Seu nickname">
          <span class="err" id="nickErr" role="alert"></span>
          <button class="btn" type="submit">Salvar no rank</button>
        </form>
        <button class="btn" id="ovBtn" type="button"></button>
        <p class="hint" id="ovHint"></p>
      </div>
    </div>
  </div>
  <div class="pad" aria-label="Controles">
    <button type="button" data-d="up" aria-label="Cima">▲</button>
    <button type="button" data-d="left" aria-label="Esquerda">◀</button>
    <button type="button" data-d="down" aria-label="Baixo">▼</button>
    <button type="button" data-d="right" aria-label="Direita">▶</button>
  </div>
  <div class="bar">
    <span>Setas ou WASD movem · P pausa · no celular, deslize na tela</span>
    <button class="mute" id="mute" type="button">🔊 Som</button>
  </div>
  <section class="legend">
    <h3>Frutas que ajudam você</h3>
    <ul id="legend"></ul>
  </section>
</main>
</div>
<!--código para linkar o arquivo js-->
<script src="codigo.js"></script>


</body>
</html>
